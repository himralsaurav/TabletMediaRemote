name: Build Tablet Media Remote APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q TabletMediaRemote-GitHubBuild.zip
          cd TabletMediaRemote
          ls

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APKs
        working-directory: TabletMediaRemote
        run: |
          gradle --no-daemon :receiver:assembleDebug :remote:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TabletMediaRemote-APKs
          path: |
            TabletMediaRemote/receiver/build/outputs/apk/debug/*.apk
            TabletMediaRemote/remote/build/outputs/apk/debug/*.apk
