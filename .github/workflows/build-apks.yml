name: Build Tablet Media Remote APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q TabletMediaRemote-GitHubBuild.zip
          ls -la TabletMediaRemote

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix JVM targets
        working-directory: TabletMediaRemote
        run: |
          cat >> receiver/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlinOptions {
              jvmTarget = "17"
          }
          EOF

          cat >> remote/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlinOptions {
              jvmTarget = "17"
          }
          EOF

      - name: Build APKs
        working-directory: TabletMediaRemote
        run: |
          gradle --no-daemon :receiver:assembleDebug :remote:assembleDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: TabletMediaRemote-APKs
          path: |
            TabletMediaRemote/receiver/build/outputs/apk/debug/*.apk
            TabletMediaRemote/remote/build/outputs/apk/debug/*.apk
